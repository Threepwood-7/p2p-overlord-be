openapi: 3.1.0
info:
  title: overlord-be-coordinator internal api
  version: 0.1.0
servers:
  - url: http://127.0.0.1:13300
paths:
  /api/internal/register:
    post:
      operationId: registerIndexer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered indexer
          content:
            application/json:
              schema:
                type: object
                required: [registered]
                properties:
                  registered:
                    $ref: '#/components/schemas/IndexerRegistration'
  /api/internal/results:
    post:
      operationId: ingestResults
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultBatch'
      responses:
        '202':
          description: Accepted result batch
  /api/internal/snoop-flush:
    post:
      operationId: flushSnoop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [indexer_id, entries]
              properties:
                indexer_id:
                  type: string
                  format: uuid
                entries:
                  type: array
                  items:
                    $ref: '#/components/schemas/SnoopEntry'
      responses:
        '202':
          description: Accepted snoop snapshot
  /api/internal/snoop-restore/{indexer_id}:
    get:
      operationId: restoreSnoop
      parameters:
        - name: indexer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restored snoop entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnoopEntry'
  /api/internal/popular-hashes:
    get:
      operationId: popularHashes
      responses:
        '200':
          description: Popular hashes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PopularHash'
  /api/agents/{indexer_id}/interfaces:
    get:
      operationId: getAgentInterfaces
      parameters:
        - name: indexer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current coordinator-side interface view for the agent
          content:
            application/json:
              schema:
                type: object
                required: [registration, report, selection, last_error]
                properties:
                  registration:
                    $ref: '#/components/schemas/IndexerRegistration'
                  report:
                    allOf:
                      - $ref: '#/components/schemas/AgentNetworkReport'
                    nullable: true
                  selection:
                    $ref: '#/components/schemas/AgentNetworkSelections'
                  last_error:
                    type: string
                    nullable: true
  /api/agents/{indexer_id}/interface-selection:
    post:
      operationId: applyAgentInterfaceSelection
      parameters:
        - name: indexer_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentNetworkSelections'
      responses:
        '200':
          description: Refreshed interface report after applying selection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentNetworkReport'
components:
  schemas:
    Protocol:
      type: string
      enum: [kad2]
    HashType:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [ed2k]
        value:
          type: string
    ContentType:
      type: string
      enum: [video, audio, document, archive, software, unknown]
    TagEntry:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value: {}
    Source:
      type: object
      required: [protocol, address, extra]
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol'
        address:
          type: string
        extra: {}
    FileRecord:
      type: object
      required: [hashes, names, size, content_type, tags, sources]
      properties:
        hashes:
          type: array
          items:
            $ref: '#/components/schemas/HashType'
        names:
          type: array
          items:
            type: string
        size:
          type: integer
          format: int64
          nullable: true
        content_type:
          allOf:
            - $ref: '#/components/schemas/ContentType'
          nullable: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagEntry'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
    SearchJob:
      type: object
      required: [job_id, query, callback_url]
      properties:
        job_id:
          type: string
          format: uuid
        query:
          type: string
        callback_url:
          type: string
    ResultBatch:
      type: object
      required: [job_id, indexer_id, protocol, files]
      properties:
        job_id:
          type: string
          format: uuid
          nullable: true
        indexer_id:
          type: string
          format: uuid
        protocol:
          $ref: '#/components/schemas/Protocol'
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileRecord'
    InterfaceAddressFamily:
      type: string
      enum: [ipv4, ipv6]
    AgentInterfaceAddress:
      type: object
      required: [family, address]
      properties:
        family:
          $ref: '#/components/schemas/InterfaceAddressFamily'
        address:
          type: string
    AgentInterface:
      type: object
      required:
        [name, description, addresses, is_loopback, is_vpn_candidate, has_default_route]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AgentInterfaceAddress'
        is_loopback:
          type: boolean
        is_vpn_candidate:
          type: boolean
        has_default_route:
          type: boolean
    InterfaceSelectionState:
      type: string
      enum: [pending, confirmed, applied, error]
    InterfaceBindingSelection:
      type: object
      required: [selected_interface_name, bind_ip, selection_confirmed]
      properties:
        selected_interface_name:
          type: string
          nullable: true
        bind_ip:
          type: string
          nullable: true
        selection_confirmed:
          type: boolean
    InterfaceBindingReport:
      type: object
      required:
        [
          recommended_interface_name,
          selected_interface_name,
          resolved_bind_ip,
          selection_confirmed,
          ready,
          state,
          last_error
        ]
      properties:
        recommended_interface_name:
          type: string
          nullable: true
        selected_interface_name:
          type: string
          nullable: true
        resolved_bind_ip:
          type: string
          nullable: true
        selection_confirmed:
          type: boolean
        ready:
          type: boolean
        state:
          $ref: '#/components/schemas/InterfaceSelectionState'
        last_error:
          type: string
          nullable: true
    AgentNetworkReport:
      type: object
      required: [interfaces, control, p2p]
      properties:
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/AgentInterface'
        control:
          $ref: '#/components/schemas/InterfaceBindingReport'
        p2p:
          $ref: '#/components/schemas/InterfaceBindingReport'
    AgentNetworkSelections:
      type: object
      required: [control, p2p]
      properties:
        control:
          $ref: '#/components/schemas/InterfaceBindingSelection'
        p2p:
          $ref: '#/components/schemas/InterfaceBindingSelection'
    SelectedGateway:
      type: object
      required: [backend, control_url, local_addr, gateway_addr, external_ip]
      properties:
        backend:
          type: string
        control_url:
          type: string
        local_addr:
          type: string
          nullable: true
        gateway_addr:
          type: string
          nullable: true
        external_ip:
          type: string
          nullable: true
    MappedEndpoint:
      type: object
      required:
        [name, protocol, local_addr, external_addr, lease_expires_in_secs, backend]
      properties:
        name:
          type: string
        protocol:
          type: string
          enum: [tcp, udp]
        local_addr:
          type: string
        external_addr:
          type: string
        lease_expires_in_secs:
          type: integer
        backend:
          type: string
    NatStatusSnapshot:
      type: object
      required:
        [
          enabled,
          gateway_discovered,
          backend,
          bind_ip,
          igd_ip,
          gateway,
          mappings,
          observed_external_addresses,
          last_refresh_unix_secs,
          last_error
        ]
      properties:
        enabled:
          type: boolean
        gateway_discovered:
          type: boolean
        backend:
          type: string
          nullable: true
        bind_ip:
          type: string
          nullable: true
        igd_ip:
          type: string
          nullable: true
        gateway:
          allOf:
            - $ref: '#/components/schemas/SelectedGateway'
          nullable: true
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/MappedEndpoint'
        observed_external_addresses:
          type: array
          items:
            type: string
        last_refresh_unix_secs:
          type: integer
          nullable: true
        last_error:
          type: string
          nullable: true
    IndexerStats:
      type: object
      required:
        [
          indexer_id,
          protocol,
          peers_connected,
          crawl_rate,
          snoop_queue_depth,
          staging_queue_depth,
          uptime_secs,
          nat,
          interface_report
        ]
      properties:
        indexer_id:
          type: string
          format: uuid
        protocol:
          $ref: '#/components/schemas/Protocol'
        peers_connected:
          type: integer
        crawl_rate:
          type: number
        snoop_queue_depth:
          type: integer
        staging_queue_depth:
          type: integer
        uptime_secs:
          type: integer
          format: int64
        nat:
          allOf:
            - $ref: '#/components/schemas/NatStatusSnapshot'
          nullable: true
        interface_report:
          allOf:
            - $ref: '#/components/schemas/AgentNetworkReport'
          nullable: true
    ConfigUpdate:
      type: object
      required: [protocol, config]
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol'
        config: {}
    SnoopEntry:
      type: object
      required: [query, hash, hit_count, first_seen, last_seen]
      properties:
        query:
          type: string
        hash:
          allOf:
            - $ref: '#/components/schemas/HashType'
          nullable: true
        hit_count:
          type: integer
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
    PopularHash:
      type: object
      required: [hash, canonical_name, size, source_count]
      properties:
        hash:
          $ref: '#/components/schemas/HashType'
        canonical_name:
          type: string
        size:
          type: integer
          format: int64
        source_count:
          type: integer
    RegisterRequest:
      type: object
      required: [indexer_id, protocol, url, hostname, version]
      properties:
        indexer_id:
          type: string
          format: uuid
        protocol:
          $ref: '#/components/schemas/Protocol'
        url:
          type: string
        hostname:
          type: string
        version:
          type: string
    IndexerRegistration:
      allOf:
        - $ref: '#/components/schemas/RegisterRequest'
        - type: object
          required: [registered_at]
          properties:
            registered_at:
              type: string
              format: date-time
